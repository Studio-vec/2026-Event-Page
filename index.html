<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>WKF 2026</title>
  <style>
    :root {
      --bg: #f6f6f7;
      --surface: #f4f4f4;
      --border: #e8e8e8;
      --primary: #dc2626;
      --primary-dark: #991b1b;
      --accent: #fef08a;
      --accent-dark: #eab308;
      --text: #111111;
      --text-2: #666666;
      --text-3: #aaaaaa;
      --r: 18px;
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { min-height:100%; background:var(--bg); font-family:-apple-system,sans-serif; color:var(--text); }

    .page { max-width:480px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; padding:0 24px; }
    @media (max-width:374px) { .page { padding:0 18px; } }

    header {
      padding-top:max(env(safe-area-inset-top,0px),20px);
      padding-bottom:20px;
      display:flex; align-items:center; justify-content:space-between;
    }
    .logo { display:flex; align-items:center; gap:10px; }
    .logo-mark {
      width:36px; height:36px; border-radius:10px;
      background:transparent; display:flex; align-items:center; justify-content:center; overflow:hidden;
    }
    .logo-mark img { width:100%; height:100%; object-fit:contain; display:block; }
    .logo-text { line-height:1.3; }
    .logo-bot { font-size:13px; font-weight:800; color:var(--text); }
    .year-tag {
      font-size:14px; font-weight:800; color:var(--primary);
      border:1.5px solid var(--primary); padding:4px 10px; border-radius:20px;
    }

    main { flex:1; display:flex; flex-direction:column; justify-content:center; gap:36px; padding:8px 0 24px; }

    .accent-bar { width:44px; height:4px; background:var(--accent); border-radius:2px; margin-bottom:14px; }
    .hero-title { font-size:40px; font-weight:800; line-height:1.15; letter-spacing:-.03em; }
    .hero-title .accent { color:var(--primary); }

    .cta-list { display:flex; flex-direction:column; gap:10px; }

    /* MISSION1 → MISSION2 → 응모, 흰 버튼 3개를 가는 선으로 이은 프로세스 */
    .flow-card { display:flex; flex-direction:column; }
    .flow-cap { font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--text-2); padding:2px 4px 10px; }

    .flow-row {
      display:flex; align-items:center; gap:12px;
      padding:14px 16px; text-decoration:none; color:var(--text);
      background:#fff; border:1.5px solid var(--border); border-radius:16px;
      transition:background .15s, border-color .15s;
    }
    .flow-row:active { background:#f7f7f7; }
    .flow-circ {
      width:30px; height:30px; border-radius:50%; flex-shrink:0;
      background:var(--primary); color:#fff; font-size:14px; font-weight:800;
      display:flex; align-items:center; justify-content:center;
    }
    .flow-circ-final { background:var(--accent-dark); font-size:15px; }
    .flow-body { flex:1; min-width:0; }
    .flow-title { font-size:16px; font-weight:800; letter-spacing:-.01em; margin-bottom:2px; }
    .flow-desc { font-size:13px; color:var(--text-2); line-height:1.4; }
    .flow-go {
      width:26px; height:26px; border-radius:50%; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      background:rgba(0,0,0,.05); color:var(--text-2);
    }
    .flow-go svg { width:13px; height:13px; display:block; }

    /* 카드 사이 여백을 채우는 가는 커넥터 선 (첫 번째 카드 아이콘 중심 x좌표에 맞춤) */
    .flow-connector { display:flex; height:14px; }
    .flow-connector::before { content:''; display:block; width:2px; height:100%; margin-left:31px; background:var(--border); }

    .section-cap { font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--text-3); text-align:center; margin-top:10px; }

    @media (hover:hover) {
      .flow-row:hover { background:#fafafa; border-color:#dcdcdc; }
    }

    /* 버튼 공통 — 아이콘 / 텍스트 / 화살표 3단 정렬 */
    .cta {
      display:flex; align-items:center; gap:14px;
      padding:18px; border-radius:var(--r);
      text-decoration:none; color:var(--text);
      background:var(--surface); border:1.5px solid var(--border);
      transition:background .18s, border-color .18s, transform .1s;
    }
    .cta:active { background:#e9e9e9; transform:scale(.985); }
    .cta:focus-visible { outline:3px solid var(--primary); outline-offset:3px; }

    .cta-icon {
      width:50px; height:50px; border-radius:15px; flex-shrink:0;
      display:flex; align-items:center; justify-content:center; font-size:26px;
      background:rgba(220,38,38,.08);
    }
    .cta-body { flex:1; min-width:0; }
    .cta-label { font-size:18px; font-weight:800; letter-spacing:-.01em; margin-bottom:3px; }
    .cta-hint { font-size:14px; opacity:.62; }
    .cta-go {
      width:32px; height:32px; border-radius:50%; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      background:rgba(0,0,0,.06); color:var(--text-2);
    }
    .cta-go svg { width:15px; height:15px; display:block; }

    /* 유형 테스트 버튼 — 플로우 카드와 구분되는 담백한 보조 버튼 */
    .cta-quiz { background:#fff; }

    /* 좁은 화면: 라벨이 두 줄로 깨지지 않도록 여백·아이콘 축소 */
    @media (max-width:374px) {
      .cta { gap:12px; padding:16px; }
      .cta-icon { width:46px; height:46px; border-radius:13px; font-size:24px; }
      .cta-go { width:30px; height:30px; }
      .flow-card { padding:12px; }
    }

    @media (hover:hover) {
      .cta:hover { background:#ededed; border-color:#dcdcdc; }
    }


    /* ── 모션 ─────────────────────────────────────────────
       진입: 위에서부터 순서대로 부드럽게 떠오름.
       animation-fill-mode를 backwards로만 두어, 애니메이션이 돌지 않는
       환경에서도 요소가 처음부터 정상 표시됨. */
    @keyframes rise { from { opacity:0; transform:translateY(14px); } }
    header, .hero-block, .flow-card, .cta, footer {
      animation:rise .6s cubic-bezier(.22,.9,.3,1) backwards;
    }
    header { animation-delay:.04s; }
    .hero-block { animation-delay:.14s; }
    .flow-card { animation-delay:.28s; }
    .cta { animation-delay:.38s; }
    footer { animation-delay:.5s; }

    /* 강조바는 가로로 그어지듯 */
    @keyframes draw { from { width:0; } }
    .accent-bar { animation:draw .5s cubic-bezier(.22,.9,.3,1) .32s backwards; }

    /* 모션 최소화를 켠 사용자에게는 전부 정지 */
    @media (prefers-reduced-motion:reduce) {
      *, *::before, *::after { animation:none !important; transition:none !important; }
    }
    footer {
      padding:16px 0 max(env(safe-area-inset-bottom,0px),20px);
      border-top:1px solid var(--border);
      display:flex; align-items:center; justify-content:space-between;
    }
    .footer-date { font-size:15px; font-weight:700; }
    .footer-place { font-size:13px; color:var(--text-3); margin-top:2px; }
    .footer-wkf { font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--text-3); text-align:right; line-height:1.5; }
  </style>
</head>
<body>
<div class="page">
  <header>
    <div class="logo">
      <div class="logo-mark"><img src="WKF_logo.png" alt="WKF"></div>
      <div class="logo-text">
        <div class="logo-bot">The Promethean Moment</div>
      </div>
    </div>
    <div class="year-tag">2026</div>
  </header>

  <main>
    <div class="hero-block">
      <div class="accent-bar"></div>
      <h1 class="hero-title">프로메테우스의<br><span class="accent">불꽃</span>을 잡아라!</h1>
    </div>

    <div class="cta-list">
      <div class="flow-card">
        <div class="flow-cap">🎯 참여 순서</div>

        <a href="info.html#mission1" class="flow-row">
          <div class="flow-circ">1</div>
          <div class="flow-body">
            <div class="flow-title">🔥 불꽃을 찾아라</div>
            <div class="flow-desc">세션장 불꽃 스티커 모아 기념 티셔츠 받기</div>
          </div>
          <span class="flow-go" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>
        </a>

        <div class="flow-connector" aria-hidden="true"></div>

        <a href="info.html#mission2" class="flow-row">
          <div class="flow-circ">2</div>
          <div class="flow-body">
            <div class="flow-title">📰 매경플러스 구독</div>
            <div class="flow-desc">구독 등록 화면 인증하고 추가 상품 받기</div>
          </div>
          <span class="flow-go" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>
        </a>

        <div class="flow-connector" aria-hidden="true"></div>

        <a href="info.html#lottery" class="flow-row flow-row-final">
          <div class="flow-circ flow-circ-final">🎁</div>
          <div class="flow-body">
            <div class="flow-title">Z플립 추첨 응모</div>
            <div class="flow-desc">두 미션 완료 인증 후 명함 제출하면 자동 응모</div>
          </div>
          <span class="flow-go" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>
        </a>
      </div>

      <div class="section-cap">더 알아보기</div>
      <a href="quiz.html" class="cta cta-quiz">
        <div class="cta-icon">🔥</div>
        <div class="cta-body">
          <div class="cta-label">불꽃 유형 테스트</div>
          <div class="cta-hint">AI가 알려주는 나의 불꽃 유형</div>
        </div>
        <span class="cta-go" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>
      </a>
    </div>
  </main>

  <footer>
    <div>
      <div class="footer-date">2026. 09. 08 – 09. 10</div>
      <div class="footer-place">📍 서울 신라호텔</div>
    </div>
    <div class="footer-wkf">WORLD<br>KNOWLEDGE<br>FORUM</div>
  </footer>
</div>
</body>
</html>
